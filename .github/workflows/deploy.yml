name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Execute Backend Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Idempotent initial setup if the script doesn't exist yet
            mkdir -p ~/shopsmart
            cd ~/shopsmart
            if [ ! -d ".git" ]; then
              git clone https://github.com/Raman-Luhach/shopsmart.git .
            else
              git fetch origin
              git checkout -- .
              git pull origin main
            fi
            
            # Make executable and run
            chmod +x scripts/deploy-backend.sh
            ./scripts/deploy-backend.sh

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Execute Frontend Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/shopsmart
            git pull origin main
            
            # Make executable and run
            chmod +x scripts/deploy-frontend.sh
            ./scripts/deploy-frontend.sh
