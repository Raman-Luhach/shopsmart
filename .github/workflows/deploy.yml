name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Execute Backend Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 0. Bootstrap Git installation
            if ! command -v git &> /dev/null; then
              echo "Git not found. Installing..."
              if command -v dnf &> /dev/null; then
                sudo dnf install -y git
              elif command -v apt-get &> /dev/null; then
                sudo apt-get update && sudo apt-get install -y git
              fi
            fi

            # 1. Idempotent repo setup (clone or pull)
            mkdir -p ~/shopsmart
            cd ~/shopsmart
            if [ ! -d ".git" ]; then
              git clone https://github.com/Raman-Luhach/shopsmart.git .
            else
              git fetch origin
              git checkout -- .
              git pull origin main
            fi

            # 2. Make executable and run
            chmod +x scripts/deploy-backend.sh
            ./scripts/deploy-backend.sh

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Execute Frontend Deployment Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/shopsmart
            git pull origin main

            # Make executable and run
            chmod +x scripts/deploy-frontend.sh
            ./scripts/deploy-frontend.sh
