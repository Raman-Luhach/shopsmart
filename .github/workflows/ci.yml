name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECS_CLUSTER: shopsmart-cluster
  ECS_SERVICE: shopsmart-service

jobs:
  # ============================================================
  # PHASE 1: TESTING
  # ============================================================
  test-server:
    name: "Phase 1 - Server Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Run linter
        working-directory: ./server
        run: npm run lint

      - name: Run unit and integration tests with report
        working-directory: ./server
        run: npx jest --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
          JEST_JUNIT_OUTPUT_NAME: server-test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server/reports/server-test-results.xml

  test-client:
    name: "Phase 1 - Client Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run linter
        working-directory: ./client
        run: npm run lint

      - name: Run unit tests with report
        working-directory: ./client
        run: npx vitest run --reporter=default --reporter=junit --outputFile=reports/client-test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results
          path: client/reports/client-test-results.xml

  # ============================================================
  # PHASE 2: INFRASTRUCTURE PROVISIONING (TERRAFORM)
  # ============================================================
  terraform:
    name: "Phase 2 - Terraform"
    runs-on: ubuntu-latest
    needs: [test-server, test-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create Terraform state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="shopsmart-tfstate-${ACCOUNT_ID}"
          echo "STATE_BUCKET=$STATE_BUCKET" >> $GITHUB_ENV

          # Create state bucket if it doesn't exist
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Creating state bucket: $STATE_BUCKET"
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region us-east-1
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          else
            echo "State bucket already exists: $STATE_BUCKET"
          fi

      - name: Clean up orphaned resources (first run only)
        continue-on-error: true
        run: |
          # Skip cleanup if Terraform state already exists
          if aws s3 ls "s3://${STATE_BUCKET}/shopsmart/terraform.tfstate" 2>/dev/null; then
            echo "Terraform state found, skipping cleanup."
            exit 0
          fi

          echo "No state found, cleaning up orphaned resources from previous runs..."
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # Delete ECS service
          aws ecs update-service --cluster shopsmart-cluster --service shopsmart-service --desired-count 0 2>/dev/null || true
          aws ecs delete-service --cluster shopsmart-cluster --service shopsmart-service --force 2>/dev/null || true
          aws ecs update-service --cluster shopsmart-cluster --service shopsmart-backend-service --desired-count 0 2>/dev/null || true
          aws ecs delete-service --cluster shopsmart-cluster --service shopsmart-backend-service --force 2>/dev/null || true

          echo "Waiting for ECS services to finish draining..."
          aws ecs wait services-inactive --cluster shopsmart-cluster --services shopsmart-service 2>/dev/null || true
          aws ecs wait services-inactive --cluster shopsmart-cluster --services shopsmart-backend-service 2>/dev/null || true

          for ARN in $(aws ecs list-task-definitions --family-prefix shopsmart --query 'taskDefinitionArns[]' --output text 2>/dev/null); do
            aws ecs deregister-task-definition --task-definition "$ARN" 2>/dev/null || true
          done

          aws ecs delete-cluster --cluster shopsmart-cluster 2>/dev/null || true
          aws logs delete-log-group --log-group-name /ecs/shopsmart 2>/dev/null || true
          aws logs delete-log-group --log-group-name /ecs/shopsmart-backend 2>/dev/null || true
          aws ecr delete-repository --repository-name shopsmart-backend --force 2>/dev/null || true
          aws ecr delete-repository --repository-name shopsmart-frontend --force 2>/dev/null || true
          aws s3 rb "s3://shopsmart-artifacts-${ACCOUNT_ID}" --force 2>/dev/null || true
          aws s3 rb s3://shopsmart-artifacts-rl-2026 --force 2>/dev/null || true

      - name: Discover subnet IDs
        id: network
        run: |
          SUBNETS=$(aws ec2 describe-subnets --filters "Name=default-for-az,Values=true" --query 'Subnets[*].SubnetId' --output json | jq -c '.')
          echo "subnets=$SUBNETS" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend-config="bucket=${STATE_BUCKET}"

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="mongo_uri=${{ secrets.MONGO_URI }}" \
            -var='subnet_ids=${{ steps.network.outputs.subnets }}' \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

  # ============================================================
  # PHASE 3a: CONTAINER BUILD & PUSH TO ECR
  # ============================================================
  build-and-push:
    name: "Phase 3 - Docker Build & Push to ECR"
    runs-on: ubuntu-latest
    needs: [terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR repository URLs
        id: ecr-url
        run: |
          BACKEND_URL=$(aws ecr describe-repositories --repository-names shopsmart-backend --query 'repositories[0].repositoryUri' --output text)
          FRONTEND_URL=$(aws ecr describe-repositories --repository-names shopsmart-frontend --query 'repositories[0].repositoryUri' --output text)
          echo "backend=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND_URL" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        working-directory: ./server
        run: |
          docker build -t ${{ steps.ecr-url.outputs.backend }}:latest \
                       -t ${{ steps.ecr-url.outputs.backend }}:${{ github.sha }} .
          docker push ${{ steps.ecr-url.outputs.backend }}:latest
          docker push ${{ steps.ecr-url.outputs.backend }}:${{ github.sha }}

      - name: Build and push frontend image
        working-directory: ./client
        run: |
          docker build -t ${{ steps.ecr-url.outputs.frontend }}:latest \
                       -t ${{ steps.ecr-url.outputs.frontend }}:${{ github.sha }} .
          docker push ${{ steps.ecr-url.outputs.frontend }}:latest
          docker push ${{ steps.ecr-url.outputs.frontend }}:${{ github.sha }}

  # ============================================================
  # PHASE 3b: DEPLOY TO ECS FARGATE
  # ============================================================
  deploy-ecs:
    name: "Phase 3 - Deploy to ECS Fargate"
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Verify ECS service is running
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "ECS service is stable and running."

      - name: Print service status
        run: |
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount}' \
            --output table
