name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: shopsmart-backend
  ECS_CLUSTER: shopsmart-cluster
  ECS_SERVICE: shopsmart-backend-service

jobs:
  # ============================================================
  # PHASE 1: TESTING
  # ============================================================
  test-server:
    name: "Phase 1 - Server Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci

      - name: Run linter
        working-directory: ./server
        run: npm run lint

      - name: Run unit and integration tests with report
        working-directory: ./server
        run: npx jest --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
          JEST_JUNIT_OUTPUT_NAME: server-test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server/reports/server-test-results.xml

  test-client:
    name: "Phase 1 - Client Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run linter
        working-directory: ./client
        run: npm run lint

      - name: Run unit tests with report
        working-directory: ./client
        run: npx vitest run --reporter=default --reporter=junit --outputFile=reports/client-test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results
          path: client/reports/client-test-results.xml

  # ============================================================
  # PHASE 2: INFRASTRUCTURE PROVISIONING (TERRAFORM)
  # ============================================================
  terraform:
    name: "Phase 2 - Terraform"
    runs-on: ubuntu-latest
    needs: [test-server, test-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Import existing resources
        working-directory: ./terraform
        continue-on-error: true
        env:
          TF_VAR_mongo_uri: ${{ secrets.MONGO_URI }}
        run: |
          # Import resources that already exist in AWS but not in Terraform state
          terraform import aws_s3_bucket.app_bucket shopsmart-artifacts-rl-2026 || true
          terraform import aws_s3_bucket_versioning.app_bucket_versioning shopsmart-artifacts-rl-2026 || true
          terraform import aws_s3_bucket_server_side_encryption_configuration.app_bucket_encryption shopsmart-artifacts-rl-2026 || true
          terraform import aws_s3_bucket_public_access_block.app_bucket_public_access shopsmart-artifacts-rl-2026 || true
          terraform import aws_ecr_repository.shopsmart shopsmart-backend || true
          terraform import aws_ecs_cluster.shopsmart shopsmart-cluster || true
          terraform import aws_cloudwatch_log_group.ecs_logs /ecs/shopsmart-backend || true

          # Security group needs ID lookup
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=shopsmart-ecs-sg --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null || echo "")
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
            terraform import aws_security_group.ecs_sg "$SG_ID" || true
          fi

          # ECS task definition and service (may not exist yet)
          TASK_ARN=$(aws ecs describe-task-definition --task-definition shopsmart-backend --query 'taskDefinition.taskDefinitionArn' --output text 2>/dev/null || echo "")
          if [ -n "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ]; then
            terraform import aws_ecs_task_definition.shopsmart "$TASK_ARN" || true
          fi
          terraform import aws_ecs_service.shopsmart shopsmart-cluster/shopsmart-backend-service || true

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -var="mongo_uri=${{ secrets.MONGO_URI }}" -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan

  # ============================================================
  # PHASE 3a: CONTAINER BUILD & PUSH TO ECR
  # ============================================================
  build-and-push:
    name: "Phase 3 - Docker Build & Push to ECR"
    runs-on: ubuntu-latest
    needs: [terraform]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR repository URL
        id: ecr-url
        run: |
          ECR_URL=$(aws ecr describe-repositories --repository-names shopsmart-backend --query 'repositories[0].repositoryUri' --output text)
          echo "url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Build Docker image
        working-directory: ./server
        run: |
          docker build -t ${{ steps.ecr-url.outputs.url }}:latest \
                       -t ${{ steps.ecr-url.outputs.url }}:${{ github.sha }} .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.ecr-url.outputs.url }}:latest
          docker push ${{ steps.ecr-url.outputs.url }}:${{ github.sha }}

  # ============================================================
  # PHASE 3b: DEPLOY TO ECS FARGATE
  # ============================================================
  deploy-ecs:
    name: "Phase 3 - Deploy to ECS Fargate"
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment

      - name: Verify ECS service is running
        run: |
          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}
          echo "ECS service is stable and running."

      - name: Print service status
        run: |
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{Status:status,Running:runningCount,Desired:desiredCount}' \
            --output table
